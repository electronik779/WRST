name: Build and Publish Setup Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Имя тега (например, v2026.0)'
        required: true
        type: string
      build_windows:
        description: 'Собрать установщик под Windows?'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Собрать установщик под macOS?'
        required: true
        type: boolean
        default: true

jobs:
  build-windows:
    if: inputs.build_windows == true
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [win-x64, win-arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/WRST.maui.csproj'

      - name: Cache Windows MAUI Workloads
        id: cache-windows-workloads
        uses: actions/cache@v4
        with:
          path: |
            AppData\Local\Microsoft\dotnet\sdk-advertising
            AppData\Local\Microsoft\dotnet\metadata
            AppData\Local\Microsoft\dotnet\packs
          key:  runner.os -workloads-{{ hashFiles('**/WRST.maui.csproj') }}

      - name: Install MAUI Workload
        if: steps.cache-windows-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui

      - name: Create Dummy License File (Windows)
        shell: pwsh
        run: |
          New-Item -Path "." -Name "MIT License.txt" -ItemType "file" -Force

      # ИСПРАВЛЕНО: Явный restore для создания project.assets.json на Windows
      - name: Restore NuGet Packages (Windows)
        run: dotnet restore WRST.maui/WRST.maui.csproj -r \${{ matrix.arch }}

      # Теперь флаг --no-restore отработает корректно
      - name: Build Windows
        run: >
          dotnet publish WRST.maui/WRST.maui.csproj 
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -c Release 
          -r \${{ matrix.arch }}
          -p:SolutionDir="../"
          -p:PublishSingleFile=false 
          -p:WindowsAppSDKSelfContained=false
          --self-contained false
          --no-restore

      - name: Upload Raw Windows Files for Installer
        uses: actions/upload-artifact@v4
        with:
          name: raw-files-\${{ matrix.arch }}
          path: WRST.maui/bin/Release/net10.0-windows10.0.19041.0/\${{ matrix.arch }}/publish

  build-installer:
    if: inputs.build_windows == true
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows x64 Raw Files
        uses: actions/download-artifact@v4
        with:
          name: raw-files-win-x64
          path: win-x64

      - name: Download Windows arm64 Raw Files
        uses: actions/download-artifact@v4
        with:
          name: raw-files-win-arm64
          path: win-arm64

      - name: Create License File for Installer
        shell: pwsh
        run: New-Item -Path "." -Name "MIT License.txt" -ItemType "file" -Force

      - name: Create Output Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "WRST-setup-universal"

      - name: Compile Universal Installer
        run: |
          cd WRST.maui\Installer_files
          iscc /F"Setup_WRST_\${{ inputs.release_tag }}_Win" setup.iss

      - name: Upload Final Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-universal-installer
          path: WRST-setup-universal/Setup_WRST_\${{ inputs.release_tag }}_Win.exe

  build-macos:
    if: inputs.build_macos == true
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/WRST.maui.csproj'

      - name: Cache MAUI Workloads
        id: cache-workloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-advertising
            ~/.dotnet/metadata
            ~/.dotnet/packs
          key:  runner.os -workloads-{{ hashFiles('**/WRST.maui.csproj') }}

      # ИСПРАВЛЕНО: Добавлено условие `if`, чтобы шаг пропускался при успешном восстановлении из кэша
      - name: Install MAUI Workload
        if: steps.cache-workloads.outputs.cache-hit != 'true'
        run: |
          dotnet workload install maui
          dotnet workload install maccatalyst

      - name: Create Dummy License File (macOS)
        run: touch "MIT License.txt"

      # ИСПРАВЛЕНО: Добавлен явный restore перед сборкой под macOS
      - name: Restore NuGet Packages (macOS)
        run: dotnet restore WRST.maui/WRST.maui.csproj

      - name: Build macOS (x64)
        run: >
          dotnet publish WRST.maui/WRST.maui.csproj 
          -f net10.0-maccatalyst
          -p:TargetFrameworks=net10.0-maccatalyst
          -c Release 
          -r maccatalyst-x64
          -p:SolutionDir="../"
          -p:CreatePackage=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=false
          --no-restore

      - name: Build macOS (arm64)
        run: >
          dotnet publish WRST.maui/WRST.maui.csproj 
          -f net10.0-maccatalyst
          -p:TargetFrameworks=net10.0-maccatalyst
          -c Release 
          -r maccatalyst-arm64
          -p:SolutionDir="../"
          -p:CreatePackage=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=false
          --no-restore

      - name: Archive macOS App
        run: |
          cd WRST.maui/bin/Release/net10.0-maccatalyst/maccatalyst-x64/
          zip -r ../../../../../WRST.maui-maccatalyst-x64.zip WRST.maui.app
          
          cd ../maccatalyst-arm64/
          zip -r ../../../../../WRST.maui-maccatalyst-arm64.zip WRST.maui.app

      - name: Upload Raw macOS x64 App
        uses: actions/upload-artifact@v4
        with:
          name: raw-mac-maccatalyst-x64
          path: WRST.maui-maccatalyst-x64.zip

      - name: Upload Raw macOS arm64 App
        uses: actions/upload-artifact@v4
        with:
          name: raw-mac-maccatalyst-arm64
          path: WRST.maui-maccatalyst-arm64.zip

  build-macos-dmg:
    if: inputs.build_macos == true
    runs-on: macos-26
    needs: build-macos
    steps:
      - name: Download macOS x64 App
        uses: actions/download-artifact@v4
        with:
          name: raw-mac-maccatalyst-x64
          path: .

      - name: Download macOS arm64 App
        uses: actions/download-artifact@v4
        with:
          name: raw-mac-maccatalyst-arm64
          path: .

      - name: Unzip macOS Apps
        run: |
          unzip WRST.maui-maccatalyst-x64.zip -d mac-x64
          unzip WRST.maui-maccatalyst-arm64.zip -d mac-arm64

      - name: Install create-dmg tool
        run: brew install create-dmg

      - name: Create Universal MacOS App Bundle
        run: |
          mkdir -p WRST-Universal.app
          cp -R mac-arm64/WRST.maui.app/ WRST-Universal.app/
          
          EXEC_NAME=\$(defaults read "\$PWD/WRST-Universal.app/Contents/Info.plist" CFBundleExecutable)
          
          lipo -create \
            "mac-x64/WRST.maui.app/Contents/MacOS/\$EXEC_NAME" \
            "mac-arm64/WRST.maui.app/Contents/MacOS/\$EXEC_NAME" \
            -output "WRST-Universal.app/Contents/MacOS/\$EXEC_NAME"

      - name: Create DMG Installer
        run: |
          mkdir -p dmg-source
          mv WRST-Universal.app dmg-source/WRST.app
          create-dmg \
            --volname "WRST Installer" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "WRST.app" 125 125 \
            --app-drop-link 375 125 \
            "Setup_WRST_\${{ inputs.release_tag }}_Mac.dmg" \
            "dmg-source/"

      - name: Upload Final DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: "*.dmg"

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-installer, build-macos-dmg]
    if: |
      success() && 
      (inputs.build_windows == true || inputs.build_macos == true)
    permissions:
      contents: write
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            Setup_WRST_*_Win.exe
            Setup_WRST_*_Mac.dmg
